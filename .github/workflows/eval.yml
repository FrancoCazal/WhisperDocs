name: Eval suite

# Manual only: a run calls paid model APIs. It needs the secrets
# OPENAI_API_KEY, AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY; GCP_PROJECT and
# GCP_SA_KEY_JSON only when a model role is set to Gemini. The variables
# GCP_LOCATION, AWS_REGION, AGENT_EVAL_MIN_ACCURACY and
# AGENT_EVAL_MAX_HALLUCINATION_RATE are read when set.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (10 items), full (50 items) or adversarial (the prompt-injection set)"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
          - adversarial

# The run only reads the repository. Its reports, answers included, go to
# the run's artifacts, not to a branch.
permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: whisperdocs
          POSTGRES_PASSWORD: whisperdocs
          POSTGRES_DB: whisperdocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whisperdocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://whisperdocs:whisperdocs@localhost:5432/whisperdocs
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      # gemini-3.8-flash is served from the `global` location only.
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'global' }}
      # The runner context is not available at job level, so use a fixed path.
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa.json
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The app reads AWS_REGION (settings.aws_region), not AWS_DEFAULT_REGION.
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      LOG_JSON: "1"

    steps:
      - uses: actions/checkout@v4

      # The key comes in through the environment. A `${{ }}` expression is
      # pasted into the script before the shell runs it, so a key holding a
      # quote would end the string early, and the key would be part of the
      # script's text.
      - name: Write GCP service account key
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
        run: |
          umask 077
          printf '%s' "$GCP_SA_KEY_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Exactly the versions in uv.lock; the venv goes first on PATH for the
      # steps below.
      - name: Install dependencies
        env:
          UV_PYTHON: "3.12"
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Apply migrations
        run: alembic upgrade head

      # The adversarial set has a corpus and a collection of its own, so its
      # injected documents never reach a golden run (audit M-5).
      - name: Seed eval corpus
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "adversarial" ]; then
            python -m scripts.seed_eval --root fixtures/adversarial-docs --collection-name "Eval Adversarial"
          else
            python -m scripts.seed_eval
          fi

      # Exits 2 when the judge failed too often to score the run, and 3 when
      # the run is below the accuracy or above the hallucination rate; either
      # fails the job. The thresholds are app/config.py's unless the
      # variables set them. An unset variable is an empty string, so it is
      # passed only when set.
      - name: Run eval
        env:
          MODE: ${{ inputs.mode }}
          MIN_ACCURACY: ${{ vars.AGENT_EVAL_MIN_ACCURACY }}
          MAX_HALLUCINATION: ${{ vars.AGENT_EVAL_MAX_HALLUCINATION_RATE }}
        run: |
          args=(--collection-name "Eval Golden" --markdown)
          if [ "$MODE" = "smoke" ]; then args+=(--limit 10); fi
          if [ "$MODE" = "adversarial" ]; then
            args=(--collection-name "Eval Adversarial" --dataset eval/golden/adversarial.jsonl --markdown)
          fi
          if [ -n "$MIN_ACCURACY" ]; then args+=(--min-accuracy "$MIN_ACCURACY"); fi
          if [ -n "$MAX_HALLUCINATION" ]; then args+=(--max-hallucination "$MAX_HALLUCINATION"); fi
          python -m app.eval.runner run "${args[@]}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ inputs.mode }}
          path: |
            eval/results/*.json
            eval/results/*.md
          if-no-files-found: ignore
