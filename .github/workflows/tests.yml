name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: Lint, format and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.12"

      # The gitleaks hook only scans staged changes, so it is skipped here and
      # the next step scans every commit instead.
      - name: pre-commit
        env:
          SKIP: gitleaks
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.12"

      # Every locked package, optional extras included.
      - name: pip-audit
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off

  test:
    name: Types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: whisperdocs
          POSTGRES_PASSWORD: whisperdocs
          POSTGRES_DB: whisperdocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whisperdocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite mocks every model provider; the database tests (full-text,
      # HNSW, job cleanup) run against the service above.
      DATABASE_URL: postgresql+asyncpg://whisperdocs:whisperdocs@localhost:5432/whisperdocs
      TEST_DATABASE_URL: postgresql+asyncpg://whisperdocs:whisperdocs@localhost:5432/whisperdocs

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: mypy
        run: uv run --frozen mypy

      - name: Apply migrations
        run: uv run --frozen alembic upgrade head

      - name: pytest
        run: uv run --frozen pytest -q
