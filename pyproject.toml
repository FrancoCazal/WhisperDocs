[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "eval*", "design*", "fixtures*", "frontend*", "tests*", "scripts*", "docs*"]

[project]
name = "whisperdocs"
version = "0.1.0"
description = "Agentic RAG system with WhatsApp integration"
requires-python = ">=3.12"
# Floors are the minor versions the test suite last ran on; uv.lock pins the
# exact set (`uv sync --frozen`). No upper bounds: a cap held the checkpointer
# on 2.x, below its security fixes. Upgrades go through the lock and CI.
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pgvector>=0.5",
    "python-multipart>=0.0.33",
    "pdfplumber>=0.11.10",
    "tiktoken>=0.14",
    "openai>=3.46",
    "langgraph>=1.2",
    # Floors from advisories: CVE-2025-64439 and CVE-2026-48775 (checkpoint
    # deserialization), CVE-2026-71433 and CVE-2026-115883 (store namespaces).
    "langgraph-checkpoint>=4.1.1",
    "langgraph-checkpoint-postgres>=3.1.3",
    "psycopg[binary,pool]>=3.3",
    "langchain-core>=1.7",
    "langchain-google-genai>=4.4",
    "langchain-aws>=1.9",
    "boto3>=1.43",
    "tenacity>=9.1",
    "twilio>=9.13",
    "structlog>=26.1",
    "langdetect>=1.0.9",
    "prometheus-client>=0.26",
    "mcp>=2.3",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "charset-normalizer>=3.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    # Same version as the pre-commit hook, so local and CI format alike.
    "ruff==0.15.12",
    "mypy>=2.4",
    "pytest-cov>=7.0",
]
rerank = [
    # 4.0 added CrossEncoder's activation_fn, which the reranker sets.
    "sentence-transformers>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
# Gradual: the agent, the eval, the MCP server and the connectors, plus every
# app module they import, which mypy follows and reports. Default strictness;
# widen `files` as it stays green.
python_version = "3.12"
files = ["app/agent", "app/eval", "app/mcp", "app/connectors"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information: boto3, botocore and langdetect ship no stubs, and
# sentence-transformers and torch come with an optional extra. openpyxl's
# stubs are a separate package the extractor does not need.
module = [
    "boto3", "boto3.*", "botocore", "botocore.*", "langdetect", "sentence_transformers", "torch",
    "openpyxl", "openpyxl.*",
]
ignore_missing_imports = true

[tool.coverage.run]
# What `pytest --cov` measures (audit E14): the app, not the tests or scripts.
# CI fails under its floor (.github/workflows/tests.yml).
source = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Only tests/: scripts/ holds runnable scripts that a bare `pytest` would import.
testpaths = ["tests"]
# A test still running after 5 min dumps every thread's stack to stderr, so a
# hang says where it waits (BE-26). The slowest test takes about 35 s.
faulthandler_timeout = 300
