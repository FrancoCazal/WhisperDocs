# The SPA build (dist/client): files as they are, and the shell for every
# other path, which the router then resolves in the browser.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed names: a new build brings new names, so a browser keeps these.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Checked on every load: a cached shell would point at the last build's
    # assets.
    location / {
        try_files $uri /_shell.html;
        add_header Cache-Control "no-cache";
    }
}
