services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whisperdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whisperdocs}
      POSTGRES_DB: ${POSTGRES_DB:-whisperdocs}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whisperdocs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whisperdocs}:${POSTGRES_PASSWORD:-whisperdocs}@db:5432/${POSTGRES_DB:-whisperdocs}
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ./eval:/code/eval
      - ./tests:/code/tests
      - ./scripts:/code/scripts
      - ./fixtures:/code/fixtures
      - ${GOOGLE_ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/gcp/adc.json:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
