# Prometheus for the `metrics` compose profile (audit E13). It scrapes the
# API's /api/v1/metrics and evaluates the alert rules in alerts.yml; firing
# alerts show at http://localhost:9090/alerts. Nothing sends them anywhere:
# a deployment routes them with an Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: whisperdocs
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
    # With API_KEY set, the metrics route asks for the key too. Write it to
    # ops/prometheus/api_key (gitignored), then uncomment:
    # http_headers:
    #   X-API-Key:
    #     files: [/etc/prometheus/api_key]
